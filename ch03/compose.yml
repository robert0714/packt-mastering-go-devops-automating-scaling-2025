services:
  # Applications
   
  chroma:
    image: ghcr.io/chroma-core/chroma:1.2.2
    # image: ghcr.io/chroma-core/chroma:0.4.24
    container_name: chroma
    depends_on:
      - alloy
    ports:
      - 8000:8000
    environment:
      - CHROMA_OTEL_COLLECTION_ENDPOINT=http://grafana-agent:4317
      - CHROMA_OTEL_SERVICE_NAME=chroma
      - CHROMA_OTEL_GRANULARITY=all
      - ANONYMIZED_TELEMETRY=False
      - TZ=Asia/Taipei
    networks:
      - lab-network      
  postgres:
    image: docker.io/library/postgres:17.7
    # image: docker.io/library/postgres:16.11
    container_name: postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=grafana
      - TZ=Asia/Taipei
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - lab-network

  # Observability
  grafana:
    # image: docker.io/grafana/grafana-oss:10.4.6
    image: docker.io/grafana/grafana-oss:12.3.1
    container_name: grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - "3000:3000"
    hostname: ${HOST_NAME:-localhost}
    user: root
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DATABASE_USER=user
      - GF_DATABASE_PASSWORD=password
      - GF_SECURITY_ADMIN_USER=user
      - GF_SECURITY_ADMIN_PASSWORD=password
      - TZ=Asia/Taipei
    volumes:
      - ./platform/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./platform/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./platform/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - lab-network
  
  loki:
    # image: docker.io/grafana/loki:2.9.9
    image: docker.io/grafana/loki:2.9.17
    container_name: loki
    command: -config.file=/etc/config/loki.yml
    user: root
    ports:
      - "3100:3100"
    hostname: ${HOST_NAME:-localhost}
    volumes:
      - ./platform/loki/loki.yml:/etc/config/loki.yml
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    networks:
      - lab-network

  prometheus:
    image: quay.io/prometheus/prometheus:v3.8.1
    # image: quay.io/prometheus/prometheus:v2.53.1
    container_name: prometheus
    user: root
    command:
      - "--config.file=/etc/config/prometheus.yml"
      - "--enable-feature=otlp-write-receiver"
      - "--enable-feature=exemplar-storage"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    hostname: ${HOST_NAME:-localhost}
    volumes:
      - ./platform/prometheus/prometheus.yml:/etc/config/prometheus.yml
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    networks:
      - lab-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  

  tempo:
    # image: docker.io/grafana/tempo:2.4.2
    image: docker.io/grafana/tempo:2.9.0
    container_name: tempo
    command: -config.file /etc/tempo-config.yml
    ports:
      - "3110"     # Tempo
      - "4317"     # OTLP gRPC
      - "4318"     # OTLP HTTP
      - "9411:9411"     # Zipkin
    hostname: ${HOST_NAME:-localhost}
    volumes:
      - ./platform/tempo/tempo.yml:/etc/tempo-config.yml
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    networks:
      - lab-network  

  alloy:
    # image: docker.io/grafana/alloy:v1.2.1
    image: docker.io/grafana/alloy:v1.12.1
    container_name: alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/data-alloy"
      - "--disable-reporting"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
      - prometheus
      - tempo
    hostname: ${HOST_NAME:-localhost}
    environment:
      - ENVIRONMENT=dev
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - PROMETHEUS_URL=http://prometheus:9090/api/v1/write
      - TEMPO_URL=http://tempo:4317
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - TZ=Asia/Taipei
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./platform/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/data-alloy
    restart: unless-stopped
    networks:
      - lab-network

volumes:
  alloy-data: { }
  grafana-data: { }
  postgres-data: { }

networks:
  lab-network:
    name: my-lab-network
