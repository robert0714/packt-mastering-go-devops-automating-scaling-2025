name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: Run go tests
        run: |
          cd ./ch07/07-03-terraform-provider-urlshortener
          go mod tidy  
          cd internal  
          go test -v
  terraform-acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: Build provider (linux_amd64)
        run: |
          set -e
          mkdir -p tf-test/plugins/registry.terraform.io/local/urlshortener/0.0.1/linux_amd64
          GOOS=linux GOARCH=amd64 go build -o tf-test/plugins/registry.terraform.io/local/urlshortener/0.0.1/linux_amd64/terraform-provider-local-urlshortener_v0.0.1 ./ch07/07-03-terraform-provider-urlshortener
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.9
      - name: Run terraform init
        working-directory: tf-test
        run: terraform init -plugin-dir=plugins -input=false
      - name: Run terraform apply
        working-directory: tf-test
        run: terraform apply -auto-approve
